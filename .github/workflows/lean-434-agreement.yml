name: Lean 4.34 OrbitPencil agreement composition gate
on:
  push:
    branches:
      - research/compose-logical-agreement-20261102-1151
  workflow_dispatch:
jobs:
  kernel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Verify pinned Lean version and compile the agreement theorem
        run: |
          set -euo pipefail
          lean --version
          bash scripts/run_lean_434_gate.sh
