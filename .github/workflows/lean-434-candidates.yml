name: Lean 4.34 candidate kernel gate (NOT prize verification)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-lean-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean/Lake and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Record toolchain
        run: |
          lean --version
          lake --version
      - name: Compile all three candidates (fail-closed)
        shell: bash
        run: bash scripts/run_lean_434_gate.sh
