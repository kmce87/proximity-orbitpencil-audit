name: Lean 4.34 candidate kernel gate (NOT prize verification)

on:
  push:
    branches: ["main", "research/**", "mca-kernel-replay-20261103-1829"]
  pull_request:
    branches: ["research/**"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-lean-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Direct setup avoids 3 GB GitHub Actions .lake cache round-trip.
      - name: Bootstrap pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          # GitHub DNS/network failures during dependency clone are transient.
          # Keep the pinned dependency graph; retry without changing proof sources.
          for attempt in 1 2 3; do
            if lake update; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: lake update failed after three attempts" >&2
              exit 1
            fi
            sleep 20
          done
          test -s lake-manifest.json
          for attempt in 1 2 3; do
            if lake exe cache get; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Mathlib cache retrieval failed after three attempts" >&2
              exit 1
            fi
            sleep 20
          done
      - name: Isolated large-Fin image membership probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/LeanPortGeometry.olean LeanPortGeometry.lean
          lake env lean LeanPortFiniteImageProbe.lean
      - name: Compile all four candidates (fail-closed)
        shell: bash
        run: bash scripts/run_lean_434_gate.sh
