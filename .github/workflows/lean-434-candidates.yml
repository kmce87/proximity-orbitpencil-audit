name: Lean 4.34 candidate kernel gate (NOT prize verification)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-lean-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # lean-action requires lake-manifest.json BEFORE its configure step.
      - name: Bootstrap pinned Lean and generate lake-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake update
          test -s lake-manifest.json
      - name: Restore Mathlib cache and set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Record toolchain
        run: |
          lean --version
          lake --version
      - name: Compile all three candidates (fail-closed)
        shell: bash
        run: bash scripts/run_lean_434_gate.sh
