name: MCA generator exact-order Lean 4.34 (local model)
on:
  push:
    branches: ["mca-generator-order-certificate-20261105-0038"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-order:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          for attempt in 1 2 3; do
            if lake update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          for attempt in 1 2 3; do
            if lake exe cache get; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
      - name: Compile explicit generator order obligations
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_lean_434_gate.sh
          lake env lean LeanPortGeneratorOrderCertificate4096.lean 2>&1 | tee /tmp/mca-order.log
          ! grep -E 'sorryAx|error:|unsolved goals' /tmp/mca-order.log
